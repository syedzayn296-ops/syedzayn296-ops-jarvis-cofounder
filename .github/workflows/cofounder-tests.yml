name: Cofounder tests

on:
  pull_request:
    branches: [development]
  push:
    branches: [development, cofounder-readiness-cleanup]

jobs:
  test:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: node --check index.js
      - name: Run smoke and regression tests
        run: node --test --test-reporter=spec test/jarvis-smoke.test.js
